# ── Symbols for the market snapshot ──────────────────────────────────
futures:
  ES=F:  "S&P 500"
  NQ=F:  "Nasdaq 100"
  YM=F:  "Dow"
  RTY=F: "Russell 2000"
volatility:
  ^VIX: "VIX"
international:
  ^N225:     "Nikkei 225 (closed)"
  ^HSI:      "Hang Seng (closed)"
  000001.SS: "Shanghai (closed)"
  ^FTSE:     "FTSE 100 (live)"
  ^GDAXI:    "DAX (live)"
  ^STOXX50E: "Euro Stoxx 50 (live)"
rates:                      # CBOE yield indexes; verified live that yfinance now reports these as
                             # plain percentages (e.g. ^TNX 4.75 = 4.75%), not the historical yield-x10
                             # scaling -- check src/fetch_markets.py:fetch_rates() if this ever drifts
  ^IRX: "13-week"
  ^FVX: "5-year"
  ^TNX: "10-year"
  ^TYX: "30-year"
dollar_commodities_crypto:
  DX-Y.NYB: "Dollar index"
  CL=F:     "WTI crude"
  BZ=F:     "Brent"
  GC=F:     "Gold"
  BTC-USD:  "Bitcoin"
  ETH-USD:  "Ether"
indices_recap:              # yesterday's closes
  ^GSPC: "S&P 500"
  ^IXIC: "Nasdaq"
  ^DJI:  "Dow"
  ^RUT:  "Russell 2000"
sectors:                    # yesterday's leaders/laggards
  XLK: "Tech"
  XLF: "Financials"
  XLE: "Energy"
  XLV: "Health care"
  XLY: "Consumer disc."
  XLP: "Staples"
  XLI: "Industrials"
  XLB: "Materials"
  XLU: "Utilities"
  XLRE: "Real estate"
  XLC: "Comm. services"

