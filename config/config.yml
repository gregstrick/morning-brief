timezone: America/Chicago
site_title: "Morning Brief"
max_headlines: 16
headline_window_hours: 18       # ignore RSS items older than this
# Optional: URL of a Cloudflare Worker (or similar) that proxies Yahoo Finance
# quotes with a CORS header, enabling the Watchlist tab's live ticker lookup
# box. See cloudflare-worker/quote-proxy.js and the README for setup. Leave
# blank to hide that feature -- everything else works fine without it.
quote_proxy_url: ""

# ── Watchlist ─────────────────────────────────────────────────────────
# Grouped; groups render as labeled sub-sections in the Watchlist card.
# Comments explain the "why" — keep them, they document the strategy.
watchlist:
  Market:
    SPY:  "S&P 500"
    QQQ:  "Nasdaq 100"
    IWM:  "Russell 2000 — small caps"
    DIA:  "Dow"
  Business Intel:
    AAPL: "Apple — product cycle news moves used iPad/MacBook prices"
    EBAY: "the marketplace itself — fees, buyer traffic, GMV commentary"
    MU:   "Micron — IS the DDR4/DRAM shortage story; earnings = RAM price signal"
    WDC:  "Western Digital — drives/NAND"
    SNDK: "SanDisk (NAND pure-play, spun off WDC) — SSD cost signal"
    DELL: "Dell — Latitude/Precision supply side"
    HPQ:  "HP — ProBook/EliteBook supply side"
    BBY:  "Best Buy — consumer electronics demand read"
  Income Portfolio:
    SCHD: "dividend core"
    JEPI: "covered-call income"
    SPYI: "S&P income"
    CHPY: "weekly income leg"
    QLDY: "weekly income leg"

